# Réglages par défaut, surchargés par local.toml (voir alacritty.toml).

[window]
opacity = 0.95
padding = { x = 8, y = 8 }

# tmux à l'ouverture, une session neuve par fenêtre. Le repli sur zsh évite de
# se retrouver sans terminal si tmux refuse de démarrer (tmux.conf invalide).
[terminal.shell]
program = "zsh"
args = ["-c", "tmux new-session || exec zsh"]

[font]
size = 11.0
normal = { family = "JetBrains Mono", style = "Regular" }

[cursor]
style = { shape = "Beam", blinking = "On" }

# --- Couleurs (Catppuccin Mocha) ----------------------------------------------
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#94e2d5"
white   = "#a6adc8"
