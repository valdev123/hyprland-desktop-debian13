# Écran de verrouillage (Super + Ctrl + L).

# Fond uni : sans « path = <image> », les options de flou ne s'appliquent à rien.
background {
    monitor =
    color = rgba(1e1e2eff)
}

input-field {
    monitor =
    size = 320, 52
    rounding = -1              # -1 : pilule, comme les modules de la barre
    outline_thickness = 2
    # Sans ça, le champ reste invisible tant qu'on n'a pas tapé : rien n'indique
    # où saisir le mot de passe.
    fade_on_empty = false
    dots_center = true
    outer_color = rgba(89b4faff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    fail_color = rgba(f38ba8ff)
    check_color = rgba(89b4faff)
    placeholder_text = <i>Mot de passe…</i>
    fail_text = <i>Échec ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(cdd6f4ff)
    font_size = 72
    font_family = JetBrains Mono
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(a6adc8ff)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 60
    halign = center
    valign = center
}
