# Raccourcis clavier, calqués sur ceux d'i3. Super = touche Windows.
#
# Les dispatchers « hy3: » viennent du plugin. S'il n'est pas chargé, ces
# raccourcis-là restent sans effet — le reste continue de fonctionner.
#
# Écarts assumés par rapport à i3, faute d'équivalent :
#   - Mod+S : i3 empile (stacking). hy3 n'a pas ce mode, seulement les onglets.
#   - Mod+Space (bascule focus tuilé/flottant) : pas d'équivalent Hyprland.
#   - Mod+Shift+E quitte sans demander confirmation, contrairement à i3.

$mod = SUPER
$term = foot
$menu = wofi --show drun

# --- Applications -------------------------------------------------------------
bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, N, exec, thunar             # explorateur (i3 n'a pas de raccourci dédié)
bind = $mod SHIFT, Q, hy3:killactive     # ferme la fenêtre (ou l'onglet actif)

# --- Session ------------------------------------------------------------------
bind = $mod SHIFT, C, exec, hyprctl reload   # recharge la config (i3 : Mod+Shift+C)
bind = $mod SHIFT, E, exit                   # quitte Hyprland (i3 : Mod+Shift+E)
bind = $mod CTRL, L, exec, hyprlock          # Mod+L sert au focus, cf. plus bas

# --- Découpe et disposition ---------------------------------------------------
# « makegroup » enveloppe la fenêtre courante dans un conteneur : c'est le
# « split » d'i3. Rien ne bouge à l'écran tant que la fenêtre SUIVANTE n'est
# pas ouverte — c'est normal.
bind = $mod, H, hy3:makegroup, h              # split horizontal (i3 historique)
bind = $mod, B, hy3:makegroup, h              # idem (i3 récent)
bind = $mod, V, hy3:makegroup, v              # split vertical
bind = $mod, E, hy3:changegroup, opposite     # bascule le sens de la découpe
bind = $mod, W, hy3:makegroup, tab            # passe le conteneur en onglets
bind = $mod, S, hy3:changegroup, toggletab    # onglets ↔ découpe (≈ stacking d'i3)

bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, space, togglefloating

# Remonter / redescendre dans l'arbre (i3 : focus parent / child).
bind = $mod, A, hy3:changefocus, raise
bind = $mod SHIFT, A, hy3:changefocus, lower
bind = $mod, X, hy3:expand, expand            # étend la sélection
bind = $mod SHIFT, X, hy3:expand, base        # revient à la fenêtre seule

# --- Focus --------------------------------------------------------------------
# Rangée de repos, aux positions physiques d'i3 sur un clavier AZERTY :
# J = gauche, K = bas, L = haut, M = droite.
bind = $mod, J, hy3:movefocus, l
bind = $mod, K, hy3:movefocus, d
bind = $mod, L, hy3:movefocus, u
bind = $mod, M, hy3:movefocus, r

bind = $mod, left, hy3:movefocus, l
bind = $mod, down, hy3:movefocus, d
bind = $mod, up, hy3:movefocus, u
bind = $mod, right, hy3:movefocus, r

# --- Déplacement de fenêtres --------------------------------------------------
bind = $mod SHIFT, J, hy3:movewindow, l
bind = $mod SHIFT, K, hy3:movewindow, d
bind = $mod SHIFT, L, hy3:movewindow, u
bind = $mod SHIFT, M, hy3:movewindow, r

bind = $mod SHIFT, left, hy3:movewindow, l
bind = $mod SHIFT, down, hy3:movewindow, d
bind = $mod SHIFT, up, hy3:movewindow, u
bind = $mod SHIFT, right, hy3:movewindow, r

# --- Onglets ------------------------------------------------------------------
bind = $mod, Tab, hy3:focustab, r, wrap
bind = $mod SHIFT, Tab, hy3:focustab, l, wrap
# Onglet n° 1 à 5 du groupe.
bind = $mod ALT, ampersand, hy3:focustab, 1
bind = $mod ALT, eacute, hy3:focustab, 2
bind = $mod ALT, quotedbl, hy3:focustab, 3
bind = $mod ALT, apostrophe, hy3:focustab, 4
bind = $mod ALT, parenleft, hy3:focustab, 5

# --- Mode redimensionnement (i3 : Mod+R, puis flèches, Échap pour sortir) ------
bind = $mod, R, submap, resize
submap = resize
binde = , left, resizeactive, -40 0
binde = , down, resizeactive, 0 40
binde = , up, resizeactive, 0 -40
binde = , right, resizeactive, 40 0
binde = , J, resizeactive, -40 0
binde = , K, resizeactive, 0 40
binde = , L, resizeactive, 0 -40
binde = , M, resizeactive, 40 0
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# --- Bureaux ------------------------------------------------------------------
# Rangée de chiffres AZERTY : &  é  "  '  (  -  è  _  ç
bind = $mod, ampersand, workspace, 1
bind = $mod, eacute, workspace, 2
bind = $mod, quotedbl, workspace, 3
bind = $mod, apostrophe, workspace, 4
bind = $mod, parenleft, workspace, 5
bind = $mod, minus, workspace, 6
bind = $mod, egrave, workspace, 7
bind = $mod, underscore, workspace, 8
bind = $mod, ccedilla, workspace, 9

# hy3:movetoworkspace conserve le groupe d'onglets, contrairement au dispatcher standard.
bind = $mod SHIFT, ampersand, hy3:movetoworkspace, 1
bind = $mod SHIFT, eacute, hy3:movetoworkspace, 2
bind = $mod SHIFT, quotedbl, hy3:movetoworkspace, 3
bind = $mod SHIFT, apostrophe, hy3:movetoworkspace, 4
bind = $mod SHIFT, parenleft, hy3:movetoworkspace, 5
bind = $mod SHIFT, minus, hy3:movetoworkspace, 6
bind = $mod SHIFT, egrave, hy3:movetoworkspace, 7
bind = $mod SHIFT, underscore, hy3:movetoworkspace, 8
bind = $mod SHIFT, ccedilla, hy3:movetoworkspace, 9

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# --- Souris -------------------------------------------------------------------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Captures -----------------------------------------------------------------
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy    # zone → presse-papier
bind = SHIFT, Print, exec, grim - | wl-copy             # écran entier
bind = $mod SHIFT, P, exec, hyprpicker -a               # pipette → presse-papier

# --- Multimédia (touches dédiées) ---------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
