# Hyprland — configuration principale.
#
# Ce qui dépend de la machine (plugin, GPU, clavier, écrans) n'est pas ici :
# c'est scripts/04-dotfiles.sh qui le résout, dans des fichiers non versionnés.

source = ~/.config/hypr/plugins.conf   # « plugin = …/libhy3.so » (généré, non versionné)
source = ~/.config/hypr/gpu.conf       # variables propres au GPU (généré, non versionné)
source = ~/.config/hypr/binds.conf     # raccourcis clavier
source = ~/.config/hypr/keyboard.conf  # disposition + raccourcis qui en dépendent (généré)
source = ~/.config/hypr/hy3.conf       # réglages du plugin hy3

# --- Écrans -------------------------------------------------------------------
# Règle sans nom : elle s'applique à tout écran, y compris branché à chaud.
# « highres » plutôt que « preferred » parce que le mode préféré est celui que
# l'écran annonce dans son EDID, pas son meilleur : le VG27A y déclare
# 2560x1440@60 alors que sa dalle monte à 144 Hz. Hyprland trie ici par nombre de
# pixels puis départage au taux le plus haut — donc résolution native, à sa
# fréquence maximale, sans rien coder en dur pour cette machine.
# « hypr-monitors save » fige la disposition courante dans monitors.conf, sourcé
# juste après et qui gagne donc sur cette règle.
monitor = , highres, auto, 1
source = ~/.config/hypr/monitors.conf

# --- Environnement ------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
# Rien ici sur le GPU : ce qu'il demande dépend de la machine et vit dans
# gpu.conf, généré au déploiement des dotfiles. Sur AMD (cette machine) et Intel
# il est vide — mesa n'a besoin d'aucune variable.

# --- Démarrage ----------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = udiskie --tray
exec-once = systemctl --user start hyprpolkitagent.service

# Trousseau de mots de passe (API Secret Service). Redondant quand la session est
# ouverte via greetd, qui le démarre déjà par PAM — mais indispensable quand on
# lance Hyprland à la main depuis un TTY. Relancer le démon est sans effet.
exec-once = gnome-keyring-daemon --start --components=secrets,ssh

# Transmet l'environnement Wayland à systemd et à D-Bus, sinon les portails
# (partage d'écran, sélecteur de fichiers) démarrent sans savoir où afficher.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# --- Disposition --------------------------------------------------------------
general {
    layout = hy3           # ← le plugin ; sans lui Hyprland retombe sur « dwindle »
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(31324488)
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10

    # Assez pour situer le focus au coin de l'œil, pas assez pour gêner la
    # lecture d'un terminal inactif.
    dim_inactive = true
    dim_strength = 0.04

    blur {
        enabled = true
        size = 6
        passes = 2
    }

    # Avec des gaps serrés, c'est l'ombre qui sépare deux fenêtres voisines.
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(11111bcc)
    }
}

# Flou derrière les panneaux. « ignore_alpha » exclut le fond vide de waybar,
# transparent entre les pilules : sans lui le flou s'y étale aussi.
# Syntaxe Hyprland ≥ 0.53, comme les windowrule ; « ignorezero » n'existe plus.
layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.05
layerrule = match:namespace ^(wofi)$, blur on
layerrule = match:namespace ^(notifications)$, blur on

animations {
    enabled = false
}

input {
    # kb_layout / kb_variant : dans keyboard.conf, lus dans /etc/default/keyboard.
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# Balayage à 3 doigts (pavé tactile) pour changer de bureau.
# Depuis Hyprland 0.53, « gestures:workspace_swipe » a laissé place à « gesture = ».
gesture = 3, horizontal, workspace

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# --- Règles de fenêtres -------------------------------------------------------
# Syntaxe Hyprland ≥ 0.53 : « match:<critère> <valeur>, <règle> <valeur> ».
# L'ancienne forme « windowrule = float, class:^(x)$ » ne parse plus.
windowrule = match:class ^(pavucontrol|blueman-manager)$, float on
windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:class ^(pavucontrol)$, size 800 600

# Empêche l'idle de couper l'écran pendant une vidéo en plein écran.
windowrule = match:class .*, idle_inhibit fullscreen

# --- Tes réglages -------------------------------------------------------------
# En dernier, et c'est tout l'intérêt : Hyprland retient la dernière valeur lue,
# donc local.conf peut défaire n'importe quoi de ce qui précède. Ignoré par git,
# créé par scripts/04-dotfiles.sh. S'il manque, Hyprland signale une erreur de
# config mais démarre quand même.
source = ~/.config/hypr/local.conf
