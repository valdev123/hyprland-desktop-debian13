# Hyprland — configuration principale.
# Machine : Ryzen 5 5600X + Radeon RX 6950 XT (amdgpu), Debian 13.

source = ~/.config/hypr/plugins.conf   # « plugin = …/libhy3.so » (généré, non versionné)
source = ~/.config/hypr/binds.conf     # raccourcis clavier
source = ~/.config/hypr/hy3.conf       # réglages du plugin hy3

# --- Écrans -------------------------------------------------------------------
# Résolution et taux de rafraîchissement préférés, mise à l'échelle 1.
# « hyprctl monitors » liste les noms réels si tu veux fixer une disposition.
monitor = , preferred, auto, 1

# --- Environnement ------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
# GPU AMD : le pilote libre amdgpu est chargé d'office, aucune variable NVIDIA
# n'est nécessaire ici.

# --- Démarrage ----------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = udiskie --tray
exec-once = systemctl --user start hyprpolkitagent.service

# Trousseau de mots de passe (API Secret Service). Redondant quand la session est
# ouverte via greetd, qui le démarre déjà par PAM — mais indispensable quand on
# lance Hyprland à la main depuis un TTY. Relancer le démon est sans effet.
exec-once = gnome-keyring-daemon --start --components=secrets,ssh

# Transmet l'environnement Wayland à systemd et à D-Bus, sinon les portails
# (partage d'écran, sélecteur de fichiers) démarrent sans savoir où afficher.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# --- Disposition --------------------------------------------------------------
general {
    layout = hy3           # ← le plugin ; sans lui Hyprland retombe sur « dwindle »
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 2
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1

    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 4, easeOutQuint, popin 85%
    animation = border, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, easeInOutCubic, slide
}

input {
    kb_layout = fr          # clavier AZERTY
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# --- Règles de fenêtres -------------------------------------------------------
windowrule = float, class:^(pavucontrol|blueman-manager)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = size 800 600, class:^(pavucontrol)$

# Empêche l'idle de couper l'écran pendant une vidéo en plein écran.
windowrule = idleinhibit fullscreen, class:.*
