# Réglages du plugin hy3.
# Ce bloc est ignoré sans dommage si le plugin n'est pas chargé.

plugin {
    hy3 {
        # Retire les bordures et les gaps quand une seule fenêtre occupe le bureau.
        no_gaps_when_only = 0

        # Que faire d'un groupe qui n'a plus qu'un enfant :
        # 0 = le garder, 1 = le dissoudre, 2 = le dissoudre sauf s'il est verrouillé.
        node_collapse_policy = 2

        # Marge intérieure des groupes en onglets, alignée sur gaps_out.
        group_inset = 6

        # false : la première fenêtre d'un bureau n'est pas mise en onglet d'office.
        tab_first_window = false

        # Onglets lisibles : l'ancienne hauteur de 5 px ne pouvait pas contenir
        # le texte qu'elle demandait à rendre.
        #
        # Les noms « col.active » et « rounding » d'avant n'existent pas dans
        # cette version du plugin : les couleurs sont passées dans un bloc
        # « colors » et le rayon s'appelle « radius ». Réglage muet quand le nom
        # est faux — d'où les onglets restés turquoise pendant des mois.
        # « hyprctl getoption plugin:hy3:tabs:<nom> » répond « no such option »
        # quand on se trompe.
        tabs {
            height = 22
            padding = 4
            from_top = false
            radius = 8
            border_width = 1
            render_text = true
            text_center = true
            text_font = JetBrains Mono
            text_height = 11
            text_padding = 6

            # Les noms trompent, voici ce que rend réellement le plugin :
            # « active » = l'onglet ouvert ET dont la fenêtre a le focus (c'est
            # lui qui porte l'accent), « focused » = l'onglet ouvert d'un groupe
            # que le focus a quitté, « inactive » = les autres onglets.
            colors {
                active = rgba(89b4faff)
                active_border = rgba(89b4faff)
                active_text = rgba(1e1e2eff)

                focused = rgba(45475aff)
                focused_border = rgba(45475aff)
                focused_text = rgba(cdd6f4ff)

                inactive = rgba(313244ff)
                inactive_border = rgba(313244ff)
                inactive_text = rgba(a6adc8ff)

                urgent = rgba(f38ba8ff)
                urgent_border = rgba(f38ba8ff)
                urgent_text = rgba(1e1e2eff)

                locked = rgba(f9e2afff)
                locked_border = rgba(f9e2afff)
                locked_text = rgba(1e1e2eff)
            }
        }

        autotile {
            # Désactivé : c'est lui qui produisait le placement « en spirale ».
            # Quand il est actif et qu'une nouvelle fenêtre passerait sous
            # trigger_width, hy3 ré-emballe la précédente dans une découpe
            # perpendiculaire — d'où l'alternance colonnes/lignes.
            #
            # Sans lui, chaque nouvelle fenêtre devient une sœur dans le groupe
            # racine, qui est en SplitH sur un écran paysage : elles s'alignent
            # donc simplement de gauche à droite. Pour empiler verticalement,
            # c'est Mod+V (au coup par coup), comme dans i3.
            enable = false
            trigger_width = 800
            trigger_height = 500
        }
    }
}
