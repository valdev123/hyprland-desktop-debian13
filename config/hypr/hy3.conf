# Réglages du plugin hy3.
# Ce bloc est ignoré sans dommage si le plugin n'est pas chargé.

plugin {
    hy3 {
        # Retire les bordures et les gaps quand une seule fenêtre occupe le bureau.
        no_gaps_when_only = 0

        # Que faire d'un groupe qui n'a plus qu'un enfant :
        # 0 = le garder, 1 = le dissoudre, 2 = le dissoudre sauf s'il est verrouillé.
        node_collapse_policy = 2

        # Marge intérieure des groupes en onglets.
        group_inset = 10

        # false : la première fenêtre d'un bureau n'est pas mise en onglet d'office.
        tab_first_window = false

        tabs {
            height = 5
            padding = 8
            from_top = false
            rounding = 3
            render_text = true
            text_center = true
            text_font = JetBrains Mono
            text_height = 8
            text_padding = 3

            col.active = rgba(89b4faff)
            col.urgent = rgba(f38ba8ff)
            col.inactive = rgba(45475aff)

            col.text.active = rgba(1e1e2eff)
            col.text.urgent = rgba(1e1e2eff)
            col.text.inactive = rgba(cdd6f4ff)
        }

        autotile {
            # Désactivé : c'est lui qui produisait le placement « en spirale ».
            # Quand il est actif et qu'une nouvelle fenêtre passerait sous
            # trigger_width, hy3 ré-emballe la précédente dans une découpe
            # perpendiculaire — d'où l'alternance colonnes/lignes.
            #
            # Sans lui, chaque nouvelle fenêtre devient une sœur dans le groupe
            # racine, qui est en SplitH sur un écran paysage : elles s'alignent
            # donc simplement de gauche à droite. Pour empiler verticalement,
            # c'est Mod+V (au coup par coup), comme dans i3.
            enable = false
            trigger_width = 800
            trigger_height = 500
        }
    }
}
