# Mise en veille sur inactivité.

general {
    lock_cmd = pidof hyprlock || hyprlock       # évite d'empiler les verrouillages
    before_sleep_cmd = loginctl lock-session    # verrouille AVANT la suspension
    after_sleep_cmd = hyprctl dispatch dpms on  # rallume l'écran au réveil
}

listener {
    timeout = 300                               # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360                               # 6 min : extinction de l'écran
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# La suspension automatique ne concerne qu'un portable : elle est donc générée.
source = ~/.config/hypr/hypridle-local.conf
