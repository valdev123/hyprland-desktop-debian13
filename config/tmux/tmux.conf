# tmux — préfixe C-b, celui d'origine.

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g mode-keys vi

# Sans ça, Échap traîne une demi-seconde dans vim et les éditeurs modaux.
set -g escape-time 10

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB"

# --- Découpe (i3 : le nouveau volet part du dossier courant) ------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf rechargé"

# --- Barre (Catppuccin Mocha, comme le terminal) ------------------------------
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%H:%M "
setw -g window-status-current-style "fg=#89b4fa,bold"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-style "fg=#45475a"

# --- Tes réglages -------------------------------------------------------------
# Sourcé en dernier : ce qui est dedans gagne. « -q » pour que tmux démarre quand
# même si le fichier manque.
source-file -q ~/.config/tmux/local.conf
