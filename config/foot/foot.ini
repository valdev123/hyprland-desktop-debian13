# Terminal foot (Super + Q).

font=JetBrains Mono:size=11
pad=8x8

[cursor]
style=beam
blink=yes

[colors]
alpha=0.95
background=1e1e2e
foreground=cdd6f4

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8

# --- Tes réglages -------------------------------------------------------------
# « include » n'existe que dans la section [main], et ce fichier se termine dans
# [colors] : on rouvre donc [main] pour le poser ici, en dernier — la dernière
# valeur lue gagne. Ignoré par git, créé par scripts/04-dotfiles.sh.
#
# Le man annonce « Absolute path », mais foot développe bien « ~/ » (vérifié via
# « foot --check-config »). S'il manque, foot refuse la config.
[main]
include=~/.config/foot/local.ini
